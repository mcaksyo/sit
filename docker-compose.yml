name: microservices-lab

x-messenger-environment: &messenger-environment
  APP_ENV: dev
  MESSENGER_TRANSPORT_DSN: "amqp://lab:lab_password@rabbitmq:5672/%2f/orders"

x-orders: &orders
  image: "${COMPOSE_PROJECT_NAME:-microservices-lab}-orders"
  build:
    context: .
    target: orders
  environment:
    <<: *messenger-environment
    DATABASE_URL: "postgresql://orders:orders_password@orders-db:5432/orders?serverVersion=16&charset=utf8"

x-notifications: &notifications
  image: "${COMPOSE_PROJECT_NAME:-microservices-lab}-notifications"
  build:
    context: .
    target: notifications
  environment:
    <<: *messenger-environment
    DATABASE_URL: "postgresql://notifications:notifications_password@notifications-db:5432/notifications?serverVersion=16&charset=utf8"

services:
  orders-db:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders_password
    volumes:
      - orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "orders", "-d", "orders"]
      interval: 5s
      timeout: 3s
      retries: 12

  notifications-db:
    image: postgres:16
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications_password
    volumes:
      - notifications_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "notifications", "-d", "notifications"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 15

  orders-migrate:
    <<: *orders
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction"]
    depends_on:
      orders-db:
        condition: service_healthy

  notifications-migrate:
    <<: *notifications
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction"]
    depends_on:
      notifications-db:
        condition: service_healthy

  orders:
    <<: *orders
    command: ["php", "-S", "0.0.0.0:8000", "-t", "public"]
    ports:
      - "127.0.0.1:${ORDERS_PORT:-8001}:8000"
    depends_on:
      orders-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notifications:
    <<: *notifications
    command: ["php", "bin/console", "messenger:consume", "async", "-vv"]
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notifications-api:
    <<: *notifications
    command: ["php", "-S", "0.0.0.0:8000", "-t", "public"]
    ports:
      - "127.0.0.1:${NOTIFICATIONS_PORT:-8002}:8000"
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully

  swagger:
    image: swaggerapi/swagger-ui:v5.35.0
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./swagger/openapi.json:/usr/share/nginx/html/openapi.json:ro
      - ./swagger/swagger-initializer.js:/usr/share/nginx/html/swagger-initializer.js:ro
      - ./swagger/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8088}:8080"

volumes:
  orders_data:
  notifications_data:
  rabbitmq_data:
