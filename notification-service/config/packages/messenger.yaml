framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: orders
                        type: direct
                        default_publish_routing_key: order.created
                    queues:
                        orders_notifications:
                            binding_keys: [order.created, order.status_changed]
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    jitter: 0

            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: orders_failed
                        type: fanout
                    queues:
                        orders_notifications_failed: ~
